name: frontend-pipeline

# 缓存命中结果记录集随每次提交与依赖升级一起进入部署流水线：
# 依赖升级（Dependabot PR）也会完整跑一遍缓存引擎测试，再决定能否合并发布。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖（含 vitest，随依赖升级一起校验）
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 缓存引擎与命中结果记录集测试
        run: npm run test

      - name: 生产构建（验证命中记录集随产物进入部署）
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
